    args:
      - [-ngl, 99]
      - [-c, 262144]
      - [--rope-scaling, yarn]
      - [--rope-scale, 2]
      - [--yarn-orig-ctx, 131072]
      - [--override-kv, "muse-glimmer.context_length=int:262144,dflash.context_length=int:262144"]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [-b, 2048]
      - [-ub, 512]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
      - --no-mmap

