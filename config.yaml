      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [-b, 2048]
      - [-ub, 512]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
      - --no-mmap

  # ex mari hotkey n — no draft model (hotkey n now runs qwen3.6-35b-a3b-ninfer)
  muse-glimmer:
    context_window: 262144
    model: ~/.lmstudio/models/lmstudio-community/Muse-Glimmer-30B-GGUF/muse-glimmer-30B-kquant-17gb.gguf
    args:
      - [-ngl, 99]
      - [-c, 262144]
      - [--rope-scaling, yarn]
      - [--rope-scale, 2]
      - [--yarn-orig-ctx, 131072]
      - [--override-kv, "muse-glimmer.context_length=int:262144,dflash.context_length=int:262144"]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [-b, 2048]
      - [-ub, 512]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - --kv-unified
      - [-t, 12]
