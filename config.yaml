    mmproj: ~/.lmstudio/models/utautako/Qwen3.8-27B-NVFP4-MTP-Q8attn-GGUF/mmproj-Qwen3.8-27B-NVFP4-BF16.gguf
    args:
      - [--spec-type, draft-mtp]
      - [--spec-draft-n-max, 4]
      - [-ngl, 99]
      - [-c, 262144]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [-b, 2048]
      - [-ub, 512]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - [--reasoning-effort, low]
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
