  # mari hotkey i — Inkling 2 Mini on Strata's SQ-20 pack: bit-exact
  # LOSSLESS native SF4+MX8 (19.35 GB / 18.02 GiB, 100.00% top-1, 0.00000
  # KLD; strata-inkling shape engine 0.1.65, Strata 0.2.19) + embedded W=4
  # Markov-Beam-Tree DSpark drafter ("drafting": "dspark") + the 0.64 GB
  # lossless BF16 Vision shard on the GPU (1024 image tokens). 26.4B MoE /
  # 3.4B active (5.4B looped across 48 visits), 262144 ctx. Quality above
  # the llama fork's UD-Q4_K_XL (98.0%). Chosen over SQ-10 (10.47 GB,
  # 92.35% top-1, faster raw decode): SQ-10 seemed to get lost easily in
  # long generations. (SQ-10 stays installed in the strata checkout —
  # terminal/strata-inkling-2-mini-sq-10.json — its inference preset was
  # dropped 2026-11-22.) ex: i ran ~/inference.mjs
  # inkling-2-mini-ud-q4-dspark (unsloth llama.cpp fork: 229376 ctx, kept
  # launchable below).
  # Params are setup.sh's own output + the model card — NOT the qwen
  # profiles (that mistake gave us TRAP 1). Deviations, both measured:
  #   --kv fp8     fp16 KV at 262144 OOMs this 32 GB card at load
  #                (ink_cuda.cuh:54). Stays on the primary backend (only
  #                k8v8/k8v4 retrigger TRAP 1). Engine settles ~30 GB.
  #   exe: house-patched 0.1.65 binary (TRAP 2 + the prompt cache, below).
  # sampling: GREEDY + BEAM BY CHOICE (2026-11-22 decision, after A/B): the
  #               engine default temperature 0 engages the fused W=4 beam
  #               (236 tok/s solo vs ~93-114 with card sampling). Greedy
  #               degenerates long prose (templatic repetition) and the solo
  #               beam hard-locks into exact ~200-token cycles — GUARDED by
  #               the house-patched detect_repetition_loop (periods <=512,
  #               3 exact repeats at long periods; verified: trips the real
  #               pi poem at 65% through instead of running to abort; no
  #               false positives on healthy 2000-token poems). For long
  #               creative prose, add the model card's Recommended settings
  #               back to the json: "sampling": {"temperature": 1.0,
  #               "top_p": 1.0, "min_p": 0.0} (the block's validator refuses
  #               top_k 0; default 64 is close) — ~93-114 tok/s, no loops.
  #               NOTE (two decode paths): solo/alone = fused beam 236 tok/s;
  #               concurrent with other requests (live agent traffic) the
  #               request is stopped and continues in a batch slot
  #               (generate_batched's documented hand-back) = ~156 tok/s on
  #               forward_batch numerics — a DIFFERENT greedy trajectory
  #               (explains "same prompt, different poem" between runs).
  #
  # TRAP 1 (cost a whole debugging session): NEVER pass --vram-reserve-mib,
  # --cpu-threads, --gpus 2 or --kv k8v8|k8v4 to the inkling engine —
  # make_default_backend() (engine/src/inkling2/ink_backend.h) then picks the
  # modular EP/hybrid backend instead of the primary fused CUDA one: 2-10
  # tok/s instead of 140-162, and it segfaults (at 0x900 in gemm_sk_q8_1) on
  # any prompt where one expert collects >64 tokens (host_jobs evals a null
  # host desc for VRAM-resident experts; ep_dual_gpu.cu dispatch_moe_ep).
  # The qwen-engine --vram-reserve-mib 996 voice hand-tune does NOT apply
  # here (fp8/fp16 KV and the primary backend leave >4 GB free anyway).
  #
  # TRAP 2 (found via a stuck prefill at "reading the prompt: 14,336 of
  # 15,686"): the tensor-core prefill path (ink_runner.cuh run_visit mode 0,
  # M>=128) sizes scratch in ensure_pf_attn(K_len) at ~112 KB per PROMPT
  # token, realloc'd as the prompt grows, and dalloc exit()s on OOM — which
  # deadlocks on a stdio lock and leaves the server window hung on a corpse.
  # The fallback gate only tests "480 MB free", so prompts past free-VRAM /
  # 112 KB died mid-prefill (~14K tokens on SQ-20, ~88K on SQ-10).
  # FIX: the json runs the HOUSE-PATCHED engine ~/.config/inference/bin/
  # strata-inkling (0.1.65 + our 4 patches: the scratch VRAM gate, the
  # cross-turn prompt cache, long-period loop detection, RESUME reporting —
  # committed on branch inkling-fixes-0.1.65 in /workspace/tmp/strata, PR
  # Niko1221/Strata#6707). After strata updates, rebase that branch and
  # rebuild:
  #   cd /workspace/tmp/strata && git fetch && \
  #     git rebase origin/main inkling-fixes-0.1.65 && \
  #   cd engine && cmake --build build-inkling-local --target strata-inkling -j 32 && \
  #     cp build-inkling-local/strata-inkling ~/.config/inference/bin/
  # The run-config `exe` points at the patched binary instead of
  # component:strata-inkling. Model reinstall if ever needed:
  #   cd /workspace/tmp/strata && ./setup.sh --setup --family
  #   inkling-2-mini --model SQ-20 --context 262144 --vision gpu
  #   --no-browser --yes --no-start  (then strip --vram-reserve-mib from the
  #   json if setup was passed one)
  # House patches (engine code, not params): the prefill-scratch VRAM gate
  #               (TRAP 2 — upstream exit()-deadlocks mid-prefill otherwise;
  #               prefill 7,090 ppts at 11.5K, 4,064 at 76.8K, no stalls) and
  #               the CROSS-TURN PROMPT CACHE: at prefill end the engine parks
  #               the prompt-end state in buffers of its own (ink_runner.cuh
  #               park_swa_ring: the slot's SWA ring + scales ~130 MB;
  #               ink_cuda_backend.cu d_sconv_park_: the ShortConv) so the
  #               DSpark beam keeps the speculative snapshot to itself. The
  #               ring must be parked: its slack only survives ~512 tail
  #               tokens (verified: 1,200-token reply, then a probe of the
  #               prompt's tail answered exactly). Measured: 11.5K turn1 5,601
  #               ppts / 138 tok/s decode; follow-ups cached 11464/11479,
  #               0.03-0.16 s prefill, 137-147 tok/s. usage.cached_tokens via
  #               the server.py house patch (the solo DONE line lacks the
  #               field). One parked conversation per slot (kParkSlots 4).
  # DSpark A/B (2026-11-22): decode 122 vs 128 tok/s short ctx, 95 vs 139 at
  #               11.5K (beam +46%; repetition-heavy prompts draft best).
  # Run config (GITIGNORED upstream): terminal/strata-inkling-2-mini-sq-20.json
  inkling-2-mini-strata-sq20:
    server_bin: /workspace/tmp/strata/terminal/.venv/bin/strata-serve
    server_process: strata-serve
    context_window: 262144
    artifact: ~/.config/inference/strata-serve.py
    args:
      - [--config, /workspace/tmp/strata/terminal/strata-inkling-2-mini-sq-20.json]
      - [--port, 1234]
      - --fit-max-tokens

  # mari hotkey d — DaisyRose-27B on official TensorFold 1.2.9
  # (validated 2026-11-19). This is the configuration that actually works on
  # this box:
  #   * full native 262144 window, KV resident (fp8), loaded in 23 s
  #   * ~220-260 tok/s on novel prompts with the DFlash2 drafter
  #     (vs ~74 tok/s on sglang with no speculation)
  #   * correct output, unlike BOTH sglang speculative paths
  #
  # Why TensorFold and not sglang for this checkpoint (all measured):
  #   - sglang + DSpark v2: garbage after the first token, accept rate 0.00,
  #     and its 3.64 GB draft held max_total_num_tokens to 43136.
  #   - sglang + in-checkpoint MTP as EAGLE: also garbage, accept rate 0.00,
  #     53 tok/s (SLOWER than no drafts), and the MTP draft module costs
  #     5.53 GB -> pool collapses to 5120 tokens.
  #   - sglang with no speculation: correct, 344256-token pool, but only
  #     ~74 tok/s.
  # TensorFold reads the same modelopt mixed FP8+NVFP4 checkpoint directly
  # (`tensorfold info` reports: modelopt mixed precision (FP8, NVFP4),
  # 20.44 GiB, memory floor 22.44 GiB).
  #
  # Drafter notes:
  #   * --mtp-drafts / --mtp-confidence are REFUSED for this family on CUDA
  #     ("this CUDA family's drafts are not tunable"), so the checkpoint's own
  #     15 mtp.* tensors cannot be driven explicitly here.
  #   * with no --drafter it serves "drafts: copies only" -> ~68 tok/s.
  #   * z-lab/Qwen3.8-27B-DFlash2 at --drafter-bits 4 fits the full window.
  #   * tencent/Qwen3.8-27B-DSpine-b16 does NOT fit at 262144
  #     (OutOfDeviceMemory reserving stream caches) - it needs a lower --context.
  #   * --vision is left off: the box's libturbojpeg is not 3.1.4.1 so JPEG
  #     inputs are refused anyway, and the tower would eat the KV budget.
  daisyrose-27b-tensorfold-129:
    server_bin: ~/.config/inference/bin/tensorfold-serve-129
    server_process: tf-serve-129
    context_window: 262144
    artifact: /workspace/models/DaisyRose-27B-NVFP4
    args:
      - [--context, 262144]
      - [--kv-cache, fp8]
      - [--prompt-precision, int8]
      - [--parallel, auto]
      - [--drafter, z-lab/Qwen3.8-27B-DFlash2]
      - [--drafter-bits, 4]
      - [--prompt-cache-gib, 8]
      - [--host, 127.0.0.1]
      - [--port, 1234]

  # mari hotkey q — Niklas-measured recipe on official TensorFold 1.2.9:
  # MLX 4-bit @22d8d538 + z-lab DFlash2 @50307d4c, FP8 KV, int8 prompts,
