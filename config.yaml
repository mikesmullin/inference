# Local inference server profiles, launched via ~/inference.mjs <profile>.
# Each profile becomes one llama-server instance in its own Ghostty window
# (so server logs stay visible and crashes are obvious).
#
# Moved here from the mari `ai` activity hotkeys so the launch commands
# live in one place. mari hotkeys now just call: ~/inference.mjs <profile>
#
# args style: bare "flag" items and [flag, value] pairs, one per line.
#
# Every profile serves model id `default` on :1234 (the pi harness sends
# model "default" literally and ninfer validates the id). Identity lives in
# the profile name (lock.profile / last_profile), not the served id.
# `context_window:` is the usable context length for the profile. It is
# synced on every launch to the AGL `llama-server.default` window and the pi
# `llama-server/default` contextWindow. If omitted, it is derived from the
# `-c` / `--max-context` flag in args.

# Ghostty binary used to open the server window
ghostty: ghostty
# Keep the window open after the server exits so crash output stays readable
wait_after_exit: true
# AGL agent config whose default_model is pointed at the newly started server.
# Set to null to skip the update.
agl_config: ~/.config/agl/config.yaml
# Pi harness catalog whose llama-server/default contextWindow tracks the
# launched profile (null to skip).
pi_models: ~/.pi/agent/models.json
# Generated per-profile launcher scripts are written here (re-created each launch)
script_dir: ~/.cache/inference
# Which backend opens the server on each launch:
#   ghostty — new Ghostty window (graphical session required)
#   zellij  — tiled pane in the target zellij session (run mari inside zellij)
#   auto    — zellij when $ZELLIJ_SESSION_NAME is set, else ghostty
launcher: auto
# ComfyUI launch config for `~/inference.mjs comfy [args...]` / `comfy-kill`.
# `args` are the default CLI args; command-line passthrough args are appended,
# and a passthrough --listen/--port overrides the defaults here.
comfyui:
  dir: /workspace/tmp/ComfyUI
  python: .venv/bin/python
  args: [main.py, "--listen", "127.0.0.1", "--port", "8188"]

# Tiled pane in the target zellij session
zellij:
  session: null  # null = current session via $ZELLIJ_SESSION_NAME
  direction: null  # null = zellij default split; or right/down/left/up
  focus: false   # false passes --no-focus, so mari keeps focus while logs stay visible

