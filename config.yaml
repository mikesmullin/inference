      - [--flash-attn, "on"]
      - --no-mmap

  # mari hotkey n — NInfer (ninfer-serve, NOT llama-server) with MTP3 speculative
  # decode. Same 262144-token context as the llama presets, INT8 KV, published
  # Structured-decode rate ~780 tok/s. Served on :1234 behind the same
  # llama-server AGL endpoint name, so agents keep working unchanged.
  # Needs ~26 GiB free VRAM at startup; stop other servers first (the launcher
  # does that automatically). --vision loads the artifact's Vision weights for
  # image/video input (--kv-capacity auto shrinks text KV to make room).
  qwen3.6-35b-a3b-ninfer:
    server_bin: /workspace/tmp/ninfer/vendor/ninfer/build/apps/ninfer-serve
    server_process: ninfer-serve
    context_window: 262144
    artifact: /workspace/tmp/ninfer/models/qwen3_6_35b_a3b.ninfer
    args:
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - [--max-context, 262144]
      - [--kv-capacity, auto]
      - [--max-concurrency, 1]
      - [--max-pending-requests, 1]
      - [--prefill-chunk, 1024]
      - [--device, 0]
      - [--kv-dtype, int8]
      - [--spec, mtp]
      - [--draft-tokens, 3]
      - --lm-head-draft
      - [--temperature, 0.6]
      - [--top-p, 0.95]
      - [--top-k, 20]
      - [--min-p, 0]
      - [--presence-penalty, 1.0]
      - [--frequency-penalty, 0]
      - --vision

  # mari hotkey b — Ternary Bonsai 2 27B via the iamwavecut/ninfer-all fork.
  # (The llama-GGUF preset was retired: 120 tok/s vs 420-590 here, and its
  # 7.5 GB of files + fork binary were removed.)
  # tuning results (structured SQL :1234, thinking off, seed 7):
  # OPTION_A (K5/rk8v4): 529 tok/s @ 67.3% | B (K7/rk8v4): 608 @ 64.5%
  # E (K7/rk4v4, current): 640 @ 65.2% (+21% over OPTION_A).
  # H (done): effort flag alone was cosmetic (default path still burned full
  # budget); --default-thinking-budget 2048 gives teeth. Sky probe: 191
  # reasoning + full answer, stop. NEXT: C/D (MTP, greedy), I (calibrate).
  # CTX 2026-09-26: max-context 262144 -> 524288 + --rope-yarn (native limit
  # is 262144; measured fits to ~960k, 512k keeps 9.3 GB margin). OPTION_A
  # stays frozen at 262144 without yarn.
  ternary-bonsai-2-ninfer:
    server_bin: /workspace/tmp/ninfer/vendor/ninfer-all/build/apps/ninfer-serve
    server_process: ninfer-serve
    context_window: 524288
    artifact: /workspace/tmp/ninfer/models/Ternary-Bonsai-2-27B-ninfer-v3.ninfer
    args:
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - [--max-context, 524288]
      - [--kv-capacity, auto]
      - [--max-concurrency, 1]
      - [--max-pending-requests, 1]
      - [--prefill-chunk, 1024]
      - [--device, 0]
      - [--kv-dtype, rk4v4]
      - --gdn-state-fp16
      - --rope-yarn
      # STEP C (done) — MTP K=3 lost single-stream: 345 @ 59.8% structured,
      # 291 @ 46.4% thinking vs DFlash2 K7 640 @ 65.2%. Reverted.
      # STEP D (done) — greedy SLOWER: 492 @ 46.2% vs stochastic 640 @ 65.2%.
      # Draft head agrees more with the stochastic target; keep sampling.
      # STEP I (done) — calibrated profile (41 keys) measured: 608/510/673
      # across seeds vs 640 uncalibrated. Variance is stochastic acceptance
      # (49-69%), not the profile. No gain over the built-in 5090 profile;
      # dropped for simplicity (file kept at vendor/ninfer-all/).
      - [--spec, dflash2]
      - [--draft-tokens, 7]
      - --vision
      # STEP H — medium default effort + 2048 thinking-token budget.
      # Effort label alone proved cosmetic (default path still burned 1024
      # reasoning vs 273 for explicit per-request medium); the budget is the
      # teeth. Caps runaway traces, forces early-close + answer. Per-request
      # budget/effort override both. Tune 2048 up if hard tasks truncate.
      - [--default-reasoning-effort, medium]
      - [--default-thinking-budget, 2048]

  # OPTION_A — frozen snapshot of ternary-bonsai-2-ninfer as of 2026-09-26
  # (DFlash2 K=5, 262144 ctx, rk8v4, vision on). The live preset moved on to
  # tuning experiments; launch this to come back to the known-good setup.
  # (No hotkey — run ~/inference.mjs ternary-bonsai-2-ninfer-option-a.)
  ternary-bonsai-2-ninfer-option-a:
    server_bin: /workspace/tmp/ninfer/vendor/ninfer-all/build/apps/ninfer-serve
    server_process: ninfer-serve
    context_window: 262144
    artifact: /workspace/tmp/ninfer/models/Ternary-Bonsai-2-27B-ninfer-v3.ninfer
    args:
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - [--max-context, 262144]
      - [--kv-capacity, auto]
      - [--max-concurrency, 1]
      - [--max-pending-requests, 1]
      - [--prefill-chunk, 1024]
      - [--device, 0]
      - [--kv-dtype, rk8v4]
      - --gdn-state-fp16
      - [--spec, dflash2]
      - [--draft-tokens, 5]
      - --vision

  # mari hotkey q — Qwen3.8-27B NVFP4 via upstream ninfer, DFlash2 K=7.
  # The "text max" shape proven on 8081: nvfp4 KV, no vision, no prefix
  # reuse. Structured probe 327 tok/s @ 68%. Context 249856, not 258048:
  # the 258048 fit had ~40 MB of margin and baseline VRAM drift (voice
  # services) tipped it into a startup-OOM crashloop on :1234. 249856
  # keeps ~150 MB of margin. (Replaces the llama GGUF q preset as the q
  # hotkey; that profile stays launchable.) Upstream has no server-side
  # effort flag — send reasoning_effort per request.
  qwen3.8-27b-nvfp4-dflash2:
    server_bin: /workspace/tmp/ninfer/vendor/ninfer/build/apps/ninfer-serve
    server_process: ninfer-serve
    context_window: 249856
    artifact: /workspace/tmp/ninfer/models/qwen3_8_27b_nvfp4.ninfer
    args:
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - [--max-context, 249856]
      - [--kv-capacity, auto]
      - [--max-concurrency, 1]
      - [--max-pending-requests, 1]
      - [--prefill-chunk, 1024]
      - [--device, 0]
      - [--kv-dtype, nvfp4]
      - --no-prefix-reuse
      - [--spec, dflash2]
      - [--draft-tokens, 7]
      - --lm-head-draft
      - [--temperature, 0.6]
      - [--top-p, 0.95]
      - [--top-k, 20]
      - [--min-p, 0]
      - [--presence-penalty, 1.0]
      - [--frequency-penalty, 0]

  # mari hotkey g — 1M context via YaRN
  gemma-4-12b-qat:
    context_window: 1048576
    model: ~/.lmstudio/models/lmstudio-community/gemma-4-12B-it-QAT-GGUF/gemma-4-12B-it-QAT-Q4_0.gguf
    mmproj: ~/.lmstudio/models/lmstudio-community/gemma-4-12B-it-QAT-GGUF/mmproj-gemma-4-12B-it-QAT-BF16.gguf
    args:
      - [-ngl, 99]
      - [-c, 1048576]
      - [--rope-scaling, yarn]
      - [--rope-scale, 4]
      - [--yarn-orig-ctx, 262144]
      - [-b, 2048]
      - [-ub, 512]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
      - --no-mmap
  # simple-jev classifier scoring (simplejev-mars demo).
  # Tuned for a very different shape of work than the chat presets above: prompts are ~1.5k tokens,
  # exactly one token is ever generated, and a decision issues one request per question. So the cost is
  # all prefill, and the knobs that matter are batch width and slot count, not context length.
  qwen3.8-27b-simplejev:
    context_window: 32768
    model: ~/.lmstudio/models/utautako/Qwen3.8-27B-NVFP4-MTP-Q8attn-GGUF/Qwen3.8-27B-NVFP4-MTP-Q8attn.gguf
    # no mmproj: the classifier is text-only, so the vision tower is VRAM and load time for nothing
    args:
      # no --spec-type: speculative decoding buys nothing when n_predict is 1 (measured: 1090 vs 1100 ms)
      - [-ngl, 99]
      # ONE slot, deliberately. Measured: with -np 4 the questions round-robin into separate slots and
      # each re-evaluates the whole shared prefix (807/547/623/541 tokens per tick) because no slot holds
      # the previous question's context. On one slot they chain -- the first question pays for the changed
      # state, the rest reuse it and pay only their own tail (4/393/469/387). Scoring concurrently across
      # slots measured no faster in wall time and often slower, so the adapter stays serial.
      # 32k is far more than the ~1.5k prompts need; the rest would be KV cache we never touch.
      - [-c, 32768]
      - [-np, 1]
      # f16 KV: with a small context there is no reason to pay dequant on every attention
      - [-ctk, f16]
      - [-ctv, f16]
      # Wide batches. Measured trade-off, and it is not the obvious one: -ub 2048 DISABLES llama.cpp's
      # partial prefix reuse (only a byte-identical prompt hits the cache; any divergence re-evaluates
      # the whole prompt), while -ub 512 keeps reuse. Wide-and-dumb still wins, because the question
      # tails are large next to the shared prefix -- 4 questions cost 647ms at -ub 2048 with no reuse
      # vs 784ms at -ub 512 with reuse. -ub 1024 is the worst of both: no reuse, 758ms.
      - [-b, 8192]
      - [-ub, 2048]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - [--reasoning-effort, low]
      - --kv-unified
      - [-t, 12]
      - [--flash-attn, "on"]
      - --no-mmap

  # mari hotkey s — Qwen3.8-Flash-Next (125B MoE, ~6B active per token) on
  # Strata, not llama.cpp/ninfer. Strata keeps all 24,576 experts pinned in
  # system RAM and fills the rest of VRAM with a cache of the most-used ones,
  # so this 32 GB card holds far more of them than the 12 GB RTX 5070 its
  # published numbers come from (IQ3_XXS 62 tok/s write, 1,110 prompt).
  #
  # RAM, not the GPU, picks the size: the experts are pinned, so VRAM only buys
  # speed (docs/DETAILS.md "RAM: all 24,576 experts, pinned"). On this 62 GB box:
  #   IQ3_XXS  42.9 GB experts + ~6 GB engine + 1.7 GB KV@131K = ~51 GB  <- this
  #   IQ3_S    50.3 GB experts + ~6 GB engine + 1.7 GB KV@131K = ~58 GB
  #            (installed, but needs the browser *and* the voice stack stopped;
  #             see qwen3.8-flash-next-strata-iq3s below)
  # Close the browser before launching either — Strata's own advice for IQ3+.
  #
  # Neither llama-style nor ninfer-style, so it uses the ninfer branch with a
  # shim: server_bin is a symlink to Strata's venv python (so the process shows
  # up as `strata-serve` for pgrep/kill instead of a bare `python`), and
  # `artifact` is strata-serve.py next to this file, which drops inference.mjs's
  # --model-id, adds --engine strata, and re-points --config at a copy whose
  # model_name is `default` (so GET /v1/models matches the :1234 contract).
  # The engine's own flags — pack, PLE shard, expert cache, MTP draft layer,
  # --max-context, --kv — live in strata-iq3_xxs.json, which is generated and
  # owned by `cd /workspace/tmp/strata && ./setup.sh --setup`. Re-running that
  # (or --calibrate) REWRITES the file, which drops the one hand-edit it has:
  #   --vram-reserve-mib 996
  # Added 2026-10-14 because the engine warned `216 MiB of VRAM free with
  # everything loaded - LOW: requests may stall` (docs/DETAILS.md:511 — a long
  # prompt then hangs at "reading the prompt" with the GPU at 100%/low power).
  # `voice` holds ~1.1 GB of VRAM, which the engine's auto 700 MiB reserve did
  # not cover. With 996 the log says `510 MiB of VRAM free` and no LOW, at a
  # cost of 207 expert slots (13125 -> 12918). Re-add it after any setup re-run.
  qwen3.8-flash-next-strata-iq3xxs:
    server_bin: /workspace/tmp/strata/.venv/bin/strata-serve
    server_process: strata-serve
    context_window: 131072
    artifact: ~/.config/inference/strata-serve.py
    args:
      - [--config, /workspace/tmp/strata/strata-iq3_xxs.json]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      # Clamp max_tokens to the context left instead of rejecting with 400
      # (Strata copies llama.cpp's reject-by-default): pi sends maxTokens 32000
      # against the 131072 window, and a 400 mid-run kills the agent turn.
      - --fit-max-tokens

  # The best-quality size (ISTA-DASLab say IQ3_S matches the full BF16 model on
  # the published tests), and the slowest. No hotkey: at ~58 GB it only fits
  # this 62 GB box with the browser, VS Code and the voice stack all stopped
  # (`systemctl --user stop perception-voice whisper presence-voice ada-back`).
  # Installed and packed, so it costs nothing but a launch to try:
  #   ~/inference.mjs qwen3.8-flash-next-strata-iq3s
  # If the server log warns that the experts leave under ~6 GB for everything
  # else, or the box starts swapping, come back to -iq3xxs.
  qwen3.8-flash-next-strata-iq3s:
    server_bin: /workspace/tmp/strata/.venv/bin/strata-serve
    server_process: strata-serve
    context_window: 131072
    artifact: ~/.config/inference/strata-serve.py
    args:
      - [--config, /workspace/tmp/strata/strata-iq3_s.json]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --fit-max-tokens

last_profile: qwen3.8-flash-next-strata-iq3xxs
