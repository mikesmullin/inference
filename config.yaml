  # ex mari hotkey q (d now runs daisyrose-27b-tensorfold-129) — Qwen3.8-27B NVFP4 via
  # upstream ninfer, DFlash2 K=7.
  # The "text max" shape proven on 8081: nvfp4 KV, no vision, no prefix
  # reuse. Structured probe 327 tok/s @ 68%. Context 249856, not 258048:
  # the 258048 fit had ~40 MB of margin and baseline VRAM drift (voice
  # services) tipped it into a startup-OOM crashloop on :1234. 249856
  # keeps ~150 MB of margin. (Replaces the llama GGUF q preset as the q
  # hotkey; that profile stays launchable.) Upstream has no server-side
  # effort flag — send reasoning_effort per request.
  qwen3.8-27b-nvfp4-dflash2:
    server_bin: /workspace/tmp/ninfer/vendor/ninfer/build/apps/ninfer-serve
    server_process: ninfer-serve
    context_window: 249856
    artifact: /workspace/tmp/ninfer/models/qwen3_8_27b_nvfp4.ninfer
    args:
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - [--max-context, 249856]
      - [--max-concurrency, 1]
      - [--max-pending-requests, 1]
      - [--prefill-chunk, 1024]
      - [--device, 0]
      - [--kv-dtype, nvfp4]
      - --no-prefix-reuse
      - [--spec, dflash2]
      - [--draft-tokens, 7]
      - --lm-head-draft
      - [--temperature, 0.6]
      - [--top-p, 0.95]
      - [--top-k, 20]
      - [--min-p, 0]
      - [--presence-penalty, 1.0]
      - [--frequency-penalty, 0]

  # mari hotkey g — 1M context via YaRN
  gemma-4-12b-qat:
    context_window: 1048576
    model: ~/.lmstudio/models/lmstudio-community/gemma-4-12B-it-QAT-GGUF/gemma-4-12B-it-QAT-Q4_0.gguf
    mmproj: ~/.lmstudio/models/lmstudio-community/gemma-4-12B-it-QAT-GGUF/mmproj-gemma-4-12B-it-QAT-BF16.gguf
    args:
      - [-ngl, 99]
      - [-c, 1048576]
      - [--rope-scaling, yarn]
      - [--rope-scale, 4]
      - [--yarn-orig-ctx, 262144]
      - [-b, 2048]
      - [-ub, 512]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
      - --no-mmap
  # simple-jev classifier scoring (simplejev-mars demo).
  # Tuned for a very different shape of work than the chat presets above: prompts are ~1.5k tokens,
  # exactly one token is ever generated, and a decision issues one request per question. So the cost is
  # all prefill, and the knobs that matter are batch width and slot count, not context length.
  qwen3.8-27b-simplejev:
    slot: systemone
    # Decision-scoring clients now connect to :1237, alongside other Jev presets.
    context_window: 32768
    model: ~/.lmstudio/models/utautako/Qwen3.8-27B-NVFP4-MTP-Q8attn-GGUF/Qwen3.8-27B-NVFP4-MTP-Q8attn.gguf
    # no mmproj: the classifier is text-only, so the vision tower is VRAM and load time for nothing
    args:
      # no --spec-type: speculative decoding buys nothing when n_predict is 1 (measured: 1090 vs 1100 ms)
      - [-ngl, 99]
      # ONE slot, deliberately. Measured: with -np 4 the questions round-robin into separate slots and
      # each re-evaluates the whole shared prefix (807/547/623/541 tokens per tick) because no slot holds
      # the previous question's context. On one slot they chain -- the first question pays for the changed
      # state, the rest reuse it and pay only their own tail (4/393/469/387). Scoring concurrently across
      # slots measured no faster in wall time and often slower, so the adapter stays serial.
      # 32k is far more than the ~1.5k prompts need; the rest would be KV cache we never touch.
      - [-c, 32768]
      - [-np, 1]
      # f16 KV: with a small context there is no reason to pay dequant on every attention
      - [-ctk, f16]
      - [-ctv, f16]
      # Wide batches. Measured trade-off, and it is not the obvious one: -ub 2048 DISABLES llama.cpp's
      # partial prefix reuse (only a byte-identical prompt hits the cache; any divergence re-evaluates
      # the whole prompt), while -ub 512 keeps reuse. Wide-and-dumb still wins, because the question
      # tails are large next to the shared prefix -- 4 questions cost 647ms at -ub 2048 with no reuse
      # vs 784ms at -ub 512 with reuse. -ub 1024 is the worst of both: no reuse, 758ms.
      - [-b, 8192]
      - [-ub, 2048]
      - [--host, 127.0.0.1]
      - [--port, 1237]
      - --jinja
      - [--reasoning-effort, low]
      - --kv-unified
      - [-t, 12]
      - [--flash-attn, "on"]
      - --no-mmap

  # mari hotkey s — Qwen3.8-Flash-Next (125B MoE, ~6B active per token) on
  # Strata, not llama.cpp/ninfer. Strata keeps all 24,576 experts pinned in
  # system RAM and fills the rest of VRAM with a cache of the most-used ones,
  # so this 32 GB card holds far more of them than the 12 GB RTX 5070 its
  # published numbers come from (IQ3_XXS 62 tok/s write, 1,110 prompt).
  #
  # RAM, not the GPU, picks the size: the experts are pinned, so VRAM only buys
  # speed (docs/DETAILS.md "RAM: all 24,576 experts, pinned"). On this 62 GB box:
  #   IQ3_XXS  42.9 GB experts + ~6 GB engine + 1.7 GB KV@131K = ~51 GB  <- this
  #   IQ3_S    50.3 GB experts + ~6 GB engine + 1.7 GB KV@131K = ~58 GB
  #            (installed, but needs the browser *and* the voice stack stopped;
  #             see qwen3.8-flash-next-strata-iq3s below)
  # Close the browser before launching either — Strata's own advice for IQ3+.
  #
  # Neither llama-style nor ninfer-style, so it uses the ninfer branch with a
  # shim: server_bin is a symlink to Strata's venv python (so the process shows
  # up as `strata-serve` for pgrep/kill instead of a bare `python`), and
  # `artifact` is strata-serve.py next to this file, which drops inference.mjs's
  # --model-id, adds --engine strata, and re-points --config at a copy whose
  # model_name is `default` (so GET /v1/models matches the :1234 contract).
  # The engine's own flags — pack, PLE shard, expert cache, MTP draft layer,
  # --max-context, --kv, --vision — live in strata-iq3_xxs.json, generated and
  # owned by `cd /workspace/tmp/strata && ./setup.sh --setup`.
  #
  # That file is GITIGNORED upstream (.gitignore `/strata-*.json`, and likewise
  # `/engine/` and `/run-*.sh`), in a checkout whose remote is Niko1221/Strata,
  # not ours. So NONE of the state below is version-controlled anywhere except
  # this comment. Rebuild it with:
  #
  #   cd /workspace/tmp/strata && ./setup.sh --setup --family qwen \
  #     --model IQ3_XXS --context 131072 --kv int8 --vision cpu \
  #     --port 1234 --yes --no-start --build
  #   then put --vram-reserve-mib back to 996 in terminal/strata-iq3_xxs.json
  #
  # Pass every flag explicitly. A bare `--setup --yes` infers its answers from
  # whichever strata-*.json was touched last (installed_configs() sorts by
  # mtime) — strata-q2_0.json and strata-iq3_s.json have no vision block, so it
  # would quietly reinstall a different size with images off. `--build` is
  # required because get_prebuilt() returns early on BUILD.json
  # "source": "local" (the engine was compiled on this box 2026-09-28), so
  # without it setup skips build_engine, never produces engine/strata-vision,
  # and writes a config pointing at a binary that does not exist.
  #
  # Two hand-edits this profile depends on:
  #
  # 1. --vram-reserve-mib 996; setup writes 700. The engine otherwise warns
  #    `216 MiB of VRAM free with everything loaded - LOW: requests may stall`
  #    (docs/DETAILS.md:511 — a long prompt then hangs at "reading the prompt",
  #    GPU at 100% and low power). `voice` holds ~1.1 GB of VRAM that the auto
  #    700 MiB reserve doesn't cover. At 996: `510 MiB of VRAM free`, no LOW.
  # 2. Images ON through the CPU encoder (`"gpu": false, max_tokens: 300`),
  #    2026-10-14. Free on the GPU — the expert cache moved only 12,918 ->
  #    12,862 slots (-0.4%) — and a 640x480 image answered in 4.1 s end to end
  #    (~1.7 s encode) on 32 Threadripper threads, not the 10-30 s the docs
  #    quote for their Ryzen 5 7600. Tradeoff: the encoder downscales to ~300
  #    image tokens while the engine logs that Qwen-VL wants 1,024 for
  #    grounding, so expect weakness on "point at X", dense screenshots and
  #    small-font OCR. `--vision gpu` gives 1,024 tokens and 0.1-0.5 s for
  #    ~1.4 GB of VRAM (~1,000 expert slots), which wants `voice` stopped.
  # 3. 2026-10-15 retune (all hand-applied to strata-iq3_xxs.json, none of
  # which setup owns): --max-context 262144, --kv q4_0 (262K KV then costs
  # the same VRAM as 131K int8 did), --spec 6, --suffix-draft 10, plus
  # `calibrate.py` results for this 5090 box: --pcie-frac 0.35 (0.55 was
  # the 5070 default; measured 143.5 vs 136.2 tok/s) and --spec-min-p 0.70
  # (strict floor wins with deeper windows: 151.5 vs 129.5). 31 workers
  # kept. Result: 12,451 expert slots (was 12,918), window up to 8 tokens,
  # ~495 MiB VRAM free. Also needs vm.nr_hugepages=20480 at boot (runtime
  # sysctl today; without it the 40 GiB arena falls back to 4 KB pages) —
  # without the pool the engine still runs, just slower on expert streams.
  # Backups: /tmp/strata-iq3_xxs.131k-backup.json, /tmp/calib-262k-q4.out.
  qwen3.8-flash-next-strata-iq3xxs:
    server_bin: /workspace/tmp/strata/terminal/.venv/bin/strata-serve
    server_process: strata-serve
    context_window: 262144
    artifact: ~/.config/inference/strata-serve.py
    args:
      - [--config, /workspace/tmp/strata/terminal/strata-iq3_xxs.json]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      # Clamp max_tokens to the context left instead of rejecting with 400
      # (Strata copies llama.cpp's reject-by-default): pi sends maxTokens 32000
      # against the 262144 window, and a 400 mid-run kills the agent turn.
      - --fit-max-tokens

  # The best-quality size (ISTA-DASLab say IQ3_S matches the full BF16 model on
  # the published tests), and the slowest. No hotkey: at ~58 GB it only fits
  # this 62 GB box with the browser, VS Code and the voice stack all stopped
  # (`systemctl --user stop perception-voice whisper presence-voice ada-back`).
  # Installed and packed, so it costs nothing but a launch to try:
  #   ~/inference.mjs qwen3.8-flash-next-strata-iq3s
  # If the server log warns that the experts leave under ~6 GB for everything
  # else, or the box starts swapping, come back to -iq3xxs.
  qwen3.8-flash-next-strata-iq3s:
    server_bin: /workspace/tmp/strata/terminal/.venv/bin/strata-serve
    server_process: strata-serve
    context_window: 131072
    artifact: ~/.config/inference/strata-serve.py
    args:
      - [--config, /workspace/tmp/strata/terminal/strata-iq3_s.json]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --fit-max-tokens

  # mari hotkey l — H2O-Lightning-4B via llama.cpp's native /v1/systemone API.
  # The :1237 System One slot coexists with the :1234 text slot; launching
  # this only replaces the previous :1237 occupant. mail1 uses SYSTEMONE_URL.
  # Q8_0 text-only used ~5.2 GiB VRAM; vision adds the 0.63 GiB F16 projector
  # plus runtime buffers (total with vision still to be measured).
  # mmproj enables image decisions; 1024 image tokens is the model card's
  # validated budget. Keep one slot for stable per-option probabilities.
  h2o-lightning-4b:
    slot: systemone
    server_bin: /workspace/tmp/llama.cpp-h2o-lightning/build/bin/llama-server
    server_process: llama-server
    model: /workspace/tmp/llama.cpp-h2o-lightning/models/h2o/h2o-lightning-4b-Q8_0.gguf
    mmproj: /workspace/tmp/llama.cpp-h2o-lightning/models/h2o/mmproj-lightning-f16.gguf
    context_window: 8192
    args:
      - [-c, "8192"]
      - [-np, "1"]
      - [--no-kv-unified]
      - [--image-max-tokens, "1024"]
      - [--host, 127.0.0.1]
      - [--port, 1237]
      - [--threads, 4]
      # vector-DB embeddings via llama.cpp native endpoint (already in VRAM):
      # one L2-normalized vector per input, so OpenAI clients get a single
      # embedding per document instead of a per-token list
      - [--embeddings]
      - [--pooling, last]

  # mari hotkey l — Laya (421M ModernBERT System One decision model) on the
  # :1237 slot, a single in-process worker (~4.2 GB VRAM; 2 workers ~7.3 GB,
  # 4 ~13.6 GB — docs/JEVLIKE.md §7). Coexists with the :1234 text slot; the
  # launcher only stops the previous :1237 occupant. mail1's SystemOne client
  # talks to it at SYSTEMONE_URL (default http://127.0.0.1:1237). One worker
  # is deliberate — it leaves ~6 GiB headroom on the 32 GiB card while the
  # running text model (~19 GB) still serves, which is the point of this slot.
  laya-email:
    slot: systemone
    server_bin: ~/.config/inference/bin/laya-serve
    server_process: laya-serve
    artifact: ~/.config/inference/laya-serve.py
    args:
      - [--device, cuda]
      - [--port, 1237]
      - [--threads, 8]
      - [--workers, 1]

  # mari o — PaddleOCR PP-OCRv6 medium, independent :1239 service (~1.8 GiB VRAM).
  # MCP only connects; GPU lifecycle belongs to inference/mari. k kills all slots.
  paddleocr:
    slot: ocr
    server_bin: /workspace/mcp-computer-use/.venv-ocr/bin/python
    server_process: paddle-ocr
    artifact: /workspace/mcp-vision/scripts/ocr-server.py
    args:
      - [--port, 1239]
      - [--device, gpu:0]

  # Shared CPU vision service; operator-started, independent of text/OCR/H2O.
  liquid-450m:
    slot: vision
    server_bin: /workspace/tmp/llama.cpp-h2o-lightning/build/bin/llama-server
    server_process: llama-server
    model: /workspace/mcp-computer-use/tmp/liquid-pretzel/models/LFM2.5-VL-450M-Q8_0.gguf
    mmproj: /workspace/mcp-computer-use/tmp/liquid-pretzel/models/mmproj-LFM2.5-VL-450m-F16.gguf
    context_window: 4096
    args:
      - [--host, 127.0.0.1]
      - [--port, 1246]
      - [--device, none]
      - [-ngl, 0]
      - --no-mmproj-offload
      - --no-op-offload
      - [-c, 4096]
      - [-np, 1]
      - [-t, 16]
      - [-tb, 16]
      - [--image-max-tokens, 256]
      - [--repeat-penalty, 1.05]


  # mari hotkey t — Qwen3.8-27B via TensorFold 1.2.6 (tf-serve/tensorfold-native,
  # NOT llama-server): MLX affine-4 weights plus the DFlash2 drafter. This is the
  # measured best of 4 formats x 3 drafters on this 5090 — 931 tok/s aggregate
  # across 9 streams, 378-459 tok/s single stream, and every drafted reply is
  # byte-identical to the same request with drafts off (exact_mode "exact").
  # Full numbers: /workspace/tmp/fireworks/tmp/HANDOFF_QWEN27_PHASE3.md
  #
  # shim: server_bin is bin/tensorfold-serve, which inserts TensorFold's `serve`
  # subcommand, rewrites inference.mjs's --model-id into --name, exports HF_HOME
  # (--drafter names a HF repo id resolved from ~/.lmstudio/tensorfold-hf), and
  # execs bin/tf-serve — a symlink to tensorfold-native, so /proc/<pid>/comm is
  # `tf-serve` for pgrep/kill rather than a truncated "tensorfold-nati".
  # `artifact` is the pinned MLX-4bit snapshot, not the repo id, because
  # inference.mjs stats it before launch.
  #
  # Sampling is left at TensorFold's own serve defaults (temperature 1.0,
  # top_k 20, top_p 0.95) rather than pinned here.
  qwen3.8-27b-tensorfold-dflash2:
    server_bin: ~/.config/inference/bin/tensorfold-serve
    server_process: tf-serve
    context_window: 262144
    artifact: ~/.lmstudio/tensorfold-hf/hub/models--TensorFold--Qwen3.8-27B-MLX-4bit/snapshots/22d8d538154e0e5b6f8dcb1fcc74a60a0798104c
    args:
      - [--host, 127.0.0.1]
      - [--port, 1234]
      # Measured on this card: a 262,144-token window costs 9.09 GiB of fp8 KV
      # for ONE stream (16.06 model + 9.09 + 1.0 reserve = 26.15 of 31.8 GiB),
      # so the full window and concurrency are mutually exclusive here. A
      # harness conversation wants the window, not nine shallow streams.
      # Others that also fit: --parallel 2 --context 131072,
      # --parallel 4 --context 65536, --parallel 6 --context 32768.
      # The window costs memory, not speed: a shallow request still decodes at
      # ~540 tok/s with the 262k window open.
      - [--parallel, 1]
      - [--context, 262144]
      - [--kv-cache, fp8]
      - [--drafter, z-lab/Qwen3.8-27B-DFlash2]
      - --no-thinking
      - --no-update-check

  # Fireworks engine MVP (concept-27b-engine branch): ConceptCountry NVFP4 +
  # DFlash2 taps + Q4 KV + YaRN. Serves :1234 contract via
  # bin/fireworks-serve (copy of fireworks target/debug/fireworks-serve).
  # MVP returns stub text; full 64-layer decode is next. Validate:
  #   ~/inference.mjs qwen-concept-27b-fireworks --dry-run
  qwen-concept-27b-fireworks:
    server_bin: ~/.config/inference/bin/fireworks-serve
    server_process: fireworks-serve
    context_window: 262144
    artifact: ~/.lmstudio/models/ConceptCountry/qwen-concept-27b-nvfp4a16
    args:
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - [--context, 262144]
      - [--kv-dtype, q4]
      - [--spec, dflash2]
      - [--draft-tokens, 7]
      - --rope-yarn

