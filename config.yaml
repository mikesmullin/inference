  # full window), card sampling (temp 0.7/top_p 0.8/top_k 20/presence 1.5),
  # thinking budget 49152. Measured: 268 tok/s code, 239 prose, 27.3 GiB.
  # On this box (2026-11-18): 226 tok/s.
  # (--kv-cache/--vision/--prompt-precision are hidden flags in 1.2.9's
