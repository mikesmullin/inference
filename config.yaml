    model: ~/.lmstudio/models/utautako/Qwen3.8-27B-NVFP4-MTP-Q8attn-GGUF/Qwen3.8-27B-NVFP4-MTP-Q8attn.gguf
    mmproj: ~/.lmstudio/models/utautako/Qwen3.8-27B-NVFP4-MTP-Q8attn-GGUF/mmproj-Qwen3.8-27B-NVFP4-BF16.gguf
    args:
      - [--spec-type, draft-mtp]
      - [--spec-draft-n-max, 4]
      - [-ngl, 99]
      - [-c, 131072]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [-b, 2048]
      - [-ub, 512]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - [--reasoning-effort, low]
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
      - --no-mmap

  # mari hotkey m — with dflash draft model
  muse-glimmer-draft:
    server_alias: muse-glimmer
    model: ~/.lmstudio/models/lmstudio-community/Muse-Glimmer-30B-GGUF/muse-glimmer-30B-kquant-17gb.gguf
    draft: ~/.lmstudio/models/lmstudio-community/Muse-Glimmer-30B-GGUF/dflash-kquant.gguf
    args:
      - [--spec-type, draft-dflash]
      - [--spec-draft-n-max, 15]
      - [-ngl, 99]
      - [-c, 262144]
      - [--rope-scaling, yarn]
      - [--rope-scale, 2]
      - [--yarn-orig-ctx, 131072]
      - [--override-kv, "muse-glimmer.context_length=int:262144,dflash.context_length=int:262144"]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [-b, 2048]
      - [-ub, 512]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
      - --no-mmap

  # mari hotkey n — no draft model
  muse-glimmer:
    model: ~/.lmstudio/models/lmstudio-community/Muse-Glimmer-30B-GGUF/muse-glimmer-30B-kquant-17gb.gguf
    args:
      - [-ngl, 99]
      - [-c, 262144]
      - [--rope-scaling, yarn]
      - [--rope-scale, 2]
      - [--yarn-orig-ctx, 131072]
      - [--override-kv, "muse-glimmer.context_length=int:262144,dflash.context_length=int:262144"]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [-b, 2048]
      - [-ub, 512]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
