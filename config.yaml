      - [--rope-scale, 4]
      - [--yarn-orig-ctx, 262144]
      - [-b, 2048]
      - [-ub, 512]
      - [-ctk, q4_0]
      - [-ctv, q4_0]
      - [--host, 127.0.0.1]
      - [--port, 1234]
      - --jinja
      - --kv-unified
      - [-t, 12]
      - [-np, 1]
      - [--flash-attn, "on"]
      - --no-mmap
